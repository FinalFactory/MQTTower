# MQTTower stack: dashboard + broker (Mosquitto + Agent in one image).
#
# - Default: `docker compose up -d` — dashboard (8080), MQTT (1883), agent HTTP (5080).
# - Multi-broker UI: `docker compose --profile multi-broker up -d` — adds second broker (1884, agent 5081).
#   Register two broker profiles (different Agent URL / API key).

services:
  mqttower-broker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    image: mqttower/broker:local
    container_name: mqttower-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Agent__ApiKey: ${AGENT_API_KEY:-agent-dev-key}
      Agent__HttpsPort: 0
      Agent__HttpPort: 5080
      Agent__DashboardUrl: http://mqttower:8080
      Agent__RegistrationToken: ${REGISTRATION_SECRET:-dev-registration-secret}
      Agent__AutoRegister: "true"
      Agent__PublicAgentUrl: http://mqttower-broker:5080
      MQTTower__MosquittoConfigPath: /mosquitto/config/mosquitto.conf
      MQTTower__MosquittoLogPath: /mosquitto/log/mosquitto.log
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqttower_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log

  mqttower:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mqttower/mqttower:local
    container_name: mqttower
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MQTTOWER_ADMIN_USER: admin
      MQTTOWER_ADMIN_PASS: changeme
      ConnectionStrings__Default: Data Source=/data/mqttower/mqttower.db
      MQTTower__DatabasePath: Data Source=/data/mqttower/mqttower.db
      MQTTower__BrokerHost: mqttower-broker
      MQTTower__BrokerPort: 1883
      MQTTower__MosquittoConfigPath: /mosquitto/config/mosquitto.conf
      MQTTower__MosquittoLogPath: /mosquitto/log/mosquitto.log
      MQTTower__RegistrationSecret: ${REGISTRATION_SECRET:-dev-registration-secret}
    volumes:
      - mqttower_data:/data
      - mosquitto_logs:/mosquitto/log
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    depends_on:
      - mqttower-broker

  mqttower-broker-b:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    image: mqttower/broker:local
    container_name: mqttower-broker-b
    restart: unless-stopped
    profiles:
      - multi-broker
    ports:
      - "1884:1884"
      - "5081:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Agent__ApiKey: ${AGENT_API_KEY_B:-agent-dev-key-b}
      Agent__HttpsPort: 0
      Agent__HttpPort: 5080
      Agent__DashboardUrl: http://mqttower:8080
      Agent__RegistrationToken: ${REGISTRATION_SECRET:-dev-registration-secret}
      Agent__AutoRegister: "true"
      Agent__PublicAgentUrl: http://mqttower-broker-b:5080
      MQTTower__MosquittoConfigPath: /mosquitto/config/mosquitto.conf
      MQTTower__MosquittoLogPath: /mosquitto/log/mosquitto.log
    volumes:
      - ./mosquitto/mosquitto-b.conf:/mosquitto/config/mosquitto.conf
      - mqttower_data_b:/mosquitto/data
      - mosquitto_logs_b:/mosquitto/log
    depends_on:
      - mqttower

volumes:
  mqttower_data:
  mqttower_data_b:
  mosquitto_logs:
  mosquitto_logs_b:
