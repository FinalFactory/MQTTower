name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore MQTTower.sln

      - name: Build
        run: dotnet build MQTTower.sln --no-restore -c Release

      - name: Test
        run: dotnet test MQTTower.sln --no-build -c Release --verbosity normal
